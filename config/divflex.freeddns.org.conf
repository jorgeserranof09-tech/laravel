<VirtualHost *:443>
ServerAdmin webmaster@localhost
ServerName www.divflex.freeddns.org
ServerAlias divflex.freeddns.org
DocumentRoot /var/www/html/public

ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLEngine on

SSLCertificateFile /etc/letsencrypt/live/divflex.freeddns.org/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/divflex.freeddns.org/privkey.pem

	<FilesMatch "\.(?:cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>
	<Directory /usr/lib/cgi-bin>
		SSLOptions +StdEnvVars
	</Directory>
	<Directory>
		Options -Indexes
		AllowOverride All
		Require all granted
	</Directory>
	
	
</VirtualHost>
<VirtualHost *:80>
	ServerName www.divflex.freeddns.org
	ServerAlias divflex.freeddns.org
	Redirect permanent / https://www.divflex.freeddns.org
</VirtualHost>
