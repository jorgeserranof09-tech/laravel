version = 5.8.0
archive_dir = /etc/letsencrypt/archive/divflex.freeddns.org
cert = /etc/letsencrypt/live/divflex.freeddns.org/cert.pem
privkey = /etc/letsencrypt/live/divflex.freeddns.org/privkey.pem
chain = /etc/letsencrypt/live/divflex.freeddns.org/chain.pem
fullchain = /etc/letsencrypt/live/divflex.freeddns.org/fullchain.pem
[renewalparams]
account = 059109e155036bf4847fe348bcb66bd1
pref_challs = dns-01,
post_hook = '''chown root:33 /etc/letsencrypt/live /etc/letsencrypt/archive \
  && chmod 710 /etc/letsencrypt/live /etc/letsencrypt/archive \
  && chown root:33 /etc/letsencrypt/archive/divflex.freeddns.org/privkey*.pem \
  && chmod 640 /etc/letsencrypt/archive/divflex.freeddns.org/privkey*.pem'''
authenticator = dns-dynu
dns_dynu_credentials = /root/dynu-credentials.ini
server = https://acme-v02.api.letsencrypt.org/directory
key_type = ecdsa
