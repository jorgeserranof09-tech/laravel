
services:
  # Servidor web Apache + PHP + Laravel + SSL
  webserver:
    container_name: webserver
    build:
      context: .
    volumes:
      - ./app:/var/www/html
      - ./certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web_network
    restart: unless-stopped

  # Base de datos PostgreSQL
  db:
    image: postgres
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql
    networks:
      - web_network
    restart: always

  # Gestión web de PostgreSQL
  cloudbeaver:
    image: dbeaver/cloudbeaver
    container_name: dbeaver
    ports:
      - "8082:8978"
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - web_network
    restart: always

volumes:
  database_data:
  dbeaver_data:

networks:
  web_network:
    driver: bridge
